<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2B4A3E" />
    <meta name="color-scheme" content="light" />
    <!-- iOS ignores the manifest's theme_color for the standalone status bar -
         this is the only way to make it blend with the app instead of showing
         a plain default bar. black-translucent lets content draw under the
         status bar, which chamber-shell's safe-area padding then accounts for. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Congress — Capitol</title>
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
