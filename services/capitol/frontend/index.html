<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Applies a cached theme before first paint, so switching between
         Chambers (or reopening one later) doesn't flash light before
         useAppliedTheme's fetch resolves - see that hook. Nothing to do on
         a genuine first-ever visit with no cache yet; that flash is
         unavoidable without server-rendering this page. -->
    <script>
      (function () {
        var theme = localStorage.getItem("congress-theme");
        if (theme === "dark" || theme === "light") {
          document.documentElement.dataset.theme = theme;
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2B4A3E" />
    <meta name="color-scheme" content="light dark" />
    <!-- iOS ignores the manifest's theme_color for the standalone status bar -
         this is the only way to make it blend with the app instead of showing
         a plain default bar. black-translucent lets content draw under the
         status bar, which chamber-shell's safe-area padding then accounts for. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Congress — Capitol</title>
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Points every module in this document - this app's own bundle and
         every dynamically-loaded Chamber remote entry alike - at the one
         shared React/router/query-client build from vite.vendor.config.ts,
         so a Chamber mounted into this shell shares live module state with
         it instead of crashing with "invalid hook call" from two copies of
         React. No effect in `dev:web` - Vite's dev server resolves bare
         imports itself and ignores this. -->
    <script type="importmap">
      {
        "imports": {
          "react": "/vendor/react.js",
          "react-dom": "/vendor/react-dom.js",
          "react-dom/client": "/vendor/react-dom-client.js",
          "react-router-dom": "/vendor/react-router-dom.js",
          "@tanstack/react-query": "/vendor/react-query.js",
          "react/jsx-runtime": "/vendor/jsx-runtime.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
