<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Applies a cached theme before first paint - see the matching script
         in services/congress/frontend/index.html for why. -->
    <script>
      (function () {
        var theme = localStorage.getItem("congress-theme");
        if (theme === "dark" || theme === "light") {
          document.documentElement.dataset.theme = theme;
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2B4A3E" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Congress — Capitol</title>
    <link rel="icon" type="image/png" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <!-- Capitol's own canvas dynamically imports OTHER Chambers'
         remote-entry.js bundles (see Canvas.tsx/loadRemoteModule) to mount
         their widgets - those bundles are built external to
         react/react-dom/etc. and resolved at runtime against the shared
         vendor build, exactly like services/congress/frontend/index.html's
         own importmap. Capitol needs this even when accessed standalone
         (a hard refresh landing directly on /capitol, not shell-hosted
         inside Congress) since the canvas always mounts widgets regardless
         of how Capitol itself was reached - see vite.config.ts's matching
         `external` for why Capitol's own bundle is built the same way now,
         instead of bundling its own separate copy of React. -->
    <script type="importmap">
      {
        "imports": {
          "react": "/vendor/react.js",
          "react-dom": "/vendor/react-dom.js",
          "react-dom/client": "/vendor/react-dom-client.js",
          "react-router-dom": "/vendor/react-router-dom.js",
          "@tanstack/react-query": "/vendor/react-query.js",
          "react/jsx-runtime": "/vendor/jsx-runtime.js",
          "@congress/congress-ui": "/vendor/congress-ui.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
